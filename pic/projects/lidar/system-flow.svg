<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1080" viewBox="0 0 2200 1080" role="img" aria-labelledby="title description">
  <title id="title">TurtleBot4 project overview</title>
  <desc id="description">LiDAR, RGB camera and wheel odometry feed a ROS 2 state controller. LiDAR obstacle ranges also feed a safety layer. Safe velocity commands drive the mobile base, whose movement updates the sensor observations. This overview was redrawn from the project report and code.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 11 6 1 11" fill="none" stroke="#43677b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 11 6 1 11" fill="none" stroke="#78909a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="2200" height="1080" rx="28" fill="#f5f4ef"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="90" y="80" fill="#273f4b" font-size="40" font-weight="600">One ROS 2 node, three sensor inputs</text>
    <text x="90" y="126" fill="#65757b" font-size="25">A project overview of the sensing-to-motion loop</text>

    <g fill="none" stroke="#43677b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M510 265H610V665H510"/>
      <path d="M510 465H720" marker-end="url(#arrow)"/>
      <path d="M510 230H1485V300" marker-end="url(#arrow)"/>
      <path d="M1170 455H1320" marker-end="url(#arrow)"/>
      <path d="M1650 455H1780" marker-end="url(#arrow)"/>
    </g>
    <text x="1195" y="211" fill="#65757b" font-size="24">Obstacle ranges</text>
    <text x="1195" y="433" fill="#65757b" font-size="23">Command</text>
    <text x="1667" y="433" fill="#65757b" font-size="23">cmd_vel</text>

    <g fill="none" stroke="#78909a" stroke-width="4" stroke-dasharray="10 10" stroke-linejoin="round">
      <path d="M1945 610V890H40V265H90" marker-end="url(#feedback-arrow)"/>
      <path d="M40 465H90" marker-end="url(#feedback-arrow)"/>
      <path d="M40 665H90" marker-end="url(#feedback-arrow)"/>
    </g>
    <text x="1100" y="947" text-anchor="middle" fill="#65757b" font-size="28">Robot motion updates the next sensor observations</text>

    <g>
      <rect x="90" y="190" width="420" height="150" rx="20" fill="#fff" stroke="#c6d8da" stroke-width="2"/>
      <rect x="90" y="190" width="10" height="150" rx="5" fill="#4b8b88"/>
      <text x="125" y="250" fill="#315d61" font-size="35" font-weight="600">LiDAR</text>
      <text x="125" y="296" fill="#52646b" font-size="26">Approach + target tracking</text>

      <rect x="90" y="390" width="420" height="150" rx="20" fill="#fff" stroke="#dfd5bd" stroke-width="2"/>
      <rect x="90" y="390" width="10" height="150" rx="5" fill="#b89155"/>
      <text x="125" y="450" fill="#775f39" font-size="35" font-weight="600">RGB camera</text>
      <text x="125" y="496" fill="#52646b" font-size="26">Wave + thumbs-up events</text>

      <rect x="90" y="590" width="420" height="150" rx="20" fill="#fff" stroke="#cbd4e0" stroke-width="2"/>
      <rect x="90" y="590" width="10" height="150" rx="5" fill="#7188a6"/>
      <text x="125" y="650" fill="#4c627e" font-size="35" font-weight="600">Wheel odometry</text>
      <text x="125" y="696" fill="#52646b" font-size="26">Pose + return-to-home</text>
    </g>

    <rect x="720" y="300" width="450" height="310" rx="24" fill="#e7eef1" stroke="#a6bdc7" stroke-width="2"/>
    <text x="760" y="365" fill="#273f4b" font-size="36" font-weight="600">State control</text>
    <text x="760" y="414" fill="#52646b" font-size="25">Choose the current behavior</text>
    <text x="760" y="484" fill="#3b5664" font-size="26">Wait / approach / follow</text>
    <text x="760" y="528" fill="#3b5664" font-size="26">Gesture response / return</text>

    <rect x="1320" y="300" width="330" height="310" rx="24" fill="#edf0e7" stroke="#bec8ae" stroke-width="2"/>
    <text x="1350" y="365" fill="#3f5542" font-size="36" font-weight="600">Safety checks</text>
    <text x="1350" y="433" fill="#52646b" font-size="24">Front / left / right ranges</text>
    <text x="1350" y="484" fill="#52646b" font-size="24">Adjust speed and turning</text>

    <rect x="1780" y="300" width="330" height="310" rx="24" fill="#fff" stroke="#b4c4cc" stroke-width="2"/>
    <text x="1810" y="365" fill="#273f4b" font-size="36" font-weight="600">TurtleBot4</text>
    <text x="1810" y="412" fill="#273f4b" font-size="32">mobile base</text>
    <text x="1810" y="486" fill="#52646b" font-size="26">Velocity commands</text>
    <text x="1810" y="532" fill="#52646b" font-size="26">Move and observe again</text>
  </g>
</svg>
